<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Reader UI test fixture</title>
    <style>
      html.reader-root body.reader #app {
        width: 420px;
        height: 260px;
      }
      .reader #overlay {
        border: 1px solid #ddd;
      }
      #fixture-controls {
        position: fixed;
        left: 600px;
        top: 20px;
        width: 220px;
        display: grid;
        gap: 10px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="fixture-controls">
      <button id="fixture-small">小窗口（300 × 200）</button>
      <button id="fixture-large">大窗口（560 × 320）</button>
      <button id="fixture-tiny">极小窗口（220 × 90）</button>
      <button id="fixture-font">切换字号</button>
      <button id="fixture-single">切换单行</button>
      <button id="fixture-wheel">切换滚轮设备</button>
      <button id="fixture-reopen">重新载入书籍</button>
      <button id="fixture-reset">重置测试进度</button>
      <button id="fixture-stale">模拟过期窗口状态</button>
      <button id="fixture-missed">模拟丢失隐藏事件</button>
      <output id="fixture-saved">尚未保存</output>
    </div>
    <script type="module">
      import { mockIPC, mockWindows } from "@tauri-apps/api/mocks";
      import { emit } from "@tauri-apps/api/event";
      window.isTauri = true;
      if (new URLSearchParams(location.search).has("no-worker"))
        window.Worker = class {
          constructor() {
            throw new DOMException("Worker unavailable", "SecurityError");
          }
        };
      if (!new URLSearchParams(location.search).has("reader"))
        document.querySelector("#fixture-controls").hidden = true;
      mockWindows("reader");
      const text = Array.from(
        { length: 500 },
        (_, i) =>
          `第${i + 1}段。\n清晨的风穿过窗户，书页停在昨天读过的地方。😀\n`,
      ).join("");
      const book = {
        id: "fixture",
        title: "阅读测试",
        path: "fixture.txt",
        offset: Number(sessionStorage.getItem("reader-fixture-offset") || 0),
        length: text.length,
        lastRead: 0,
        available: true,
      };
      const data = {
        books: [book],
        activeId: book.id,
        settings: {
          theme: "light",
          fontSize: 18,
          lineHeight: 1.8,
          color: "#26332e",
          background: 1,
          singleLine: false,
          wheelMode: "mouse",
          width: 420,
          height: 260,
          x: null,
          y: null,
        },
      };
      const view = { state: "ready", revision: 1 };
      async function emitView(state) {
        view.state = state;
        view.revision++;
        await emit("reader-state", structuredClone(view));
      }
      mockIPC(
        async (cmd, args) => {
          if (cmd === "library") return structuredClone(data);
          if (cmd === "app_information")
            return {
              version: "0.1.8",
              preview: true,
              revision: "fixture",
              builtAt: "1793322000",
              platform: "mock",
              architecture: "test",
              logDirectory: "本地测试日志目录",
              layouts: [{ display: "测试屏幕", width: 420, height: 260 }],
              shortcuts: Object.entries(
                data.bindings || {
                  toggle: "CommandOrControl+Shift+H",
                  shelf: "CommandOrControl+Shift+O",
                  adjust: "CommandOrControl+Shift+J",
                  previous: "CommandOrControl+Alt+Left",
                  next: "CommandOrControl+Alt+Right",
                },
              ).map(([action, key]) => ({ action, key, active: true })),
            };
          if (cmd === "save_shortcuts") {
            if (new Set(Object.values(args.bindings)).size !== 5)
              throw "不同操作不能使用相同快捷键";
            data.bindings = args.bindings;
            await emit("library-changed", null);
            return;
          }
          if (cmd === "reader_state") return structuredClone(view);
          if (cmd === "current_text") return [structuredClone(book), text];
          if (cmd === "reading_navigation")
            return {
              bookId: book.id,
              chapters: [
                { title: "第一章", offset: 0, level: 0 },
                { title: "第二章", offset: 100, level: 0 },
              ],
              bookmarks: structuredClone(data.marks || []),
            };
          if (cmd === "save_bookmark") {
            (data.marks ||= []).push({
              id: String(Date.now()),
              offset: args.offset,
              label: args.label || "当前位置",
              anchor: "",
              createdAt: 0,
            });
            return;
          }
          if (cmd === "remove_bookmark") {
            data.marks = (data.marks || []).filter((m) => m.id !== args.id);
            return;
          }
          if (cmd === "save_progress") {
            book.offset = args.offset;
            sessionStorage.setItem(
              "reader-fixture-offset",
              String(book.offset),
            );
            document.title = `saved:${book.offset}`;
            document.querySelector("#fixture-saved").textContent =
              `已保存原文位置：${book.offset}`;
            return;
          }
          if (cmd === "save_settings") {
            data.settings = args.settings;
            await emit("library-changed", null);
            return;
          }
          if (cmd === "start_reading") {
            await emitView("reading");
            return;
          }
          if (cmd === "set_mode") {
            await emitView(args.mode);
            return;
          }
        },
        { shouldMockEvents: true },
      );
      for (const [name, width, height] of [
        ["small", 300, 200],
        ["large", 560, 320],
        ["tiny", 220, 90],
      ]) {
        document.querySelector(`#fixture-${name}`).onclick = () => {
          document.querySelector("#app").style.width = `${width}px`;
          document.querySelector("#app").style.height = `${height}px`;
        };
      }
      document.querySelector("#fixture-font").onclick = async () => {
        data.settings.fontSize = data.settings.fontSize === 18 ? 24 : 18;
        await emit("library-changed", null);
      };
      document.querySelector("#fixture-single").onclick = async () => {
        data.settings.singleLine = !data.settings.singleLine;
        await emit("library-changed", null);
      };
      document.querySelector("#fixture-wheel").onclick = async () => {
        data.settings.wheelMode =
          data.settings.wheelMode === "mouse" ? "trackpad" : "mouse";
        await emit("library-changed", null);
      };
      document.querySelector("#fixture-reopen").onclick = () =>
        emit("book-changed", book.id);
      document.querySelector("#fixture-reset").onclick = () => {
        book.offset = 0;
        sessionStorage.removeItem("reader-fixture-offset");
        return emit("book-changed", book.id);
      };
      document.querySelector("#fixture-stale").onclick = () =>
        emit("reader-state", { state: "hidden", revision: 0 });
      document.querySelector("#fixture-missed").onclick = () => {
        view.state = "hidden";
        view.revision++;
        // Do not emit: the periodic reader_state query must recover the change.
      };
      // Deliberately publish before the app installs listeners, as in a lazy Windows WebView.
      await emit("reader-state", structuredClone(view));
      await import("/src/main.ts");
    </script>
  </body>
</html>
