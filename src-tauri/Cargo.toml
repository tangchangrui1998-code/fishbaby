[package]
name = "fishbaby"
version = "0.1.7"
edition = "2021"
rust-version = "1.88"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-dialog = "=2.4.0"
tauri-plugin-global-shortcut = "=2.3.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
encoding_rs = "0.8"
zip = { version = "6", default-features = false, features = ["deflate"] }
roxmltree = "0.21"
scraper = "0.24"
percent-encoding = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm"] }
